<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hemabala J Portfolio Logo">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0d0b18" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#favGrad)" stroke-width="2" />
  <!-- Stylized H with AI network node motif -->
  <line x1="20" y1="16" x2="20" y2="48" stroke="url(#favGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="44" y1="16" x2="44" y2="48" stroke="url(#favGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="20" y1="32" x2="44" y2="32" stroke="url(#favGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Circuit/Network Nodes -->
  <circle cx="20" cy="16" r="3.5" fill="#a855f7" />
  <circle cx="20" cy="48" r="3.5" fill="#a855f7" />
  <circle cx="44" cy="16" r="3.5" fill="#c084fc" />
  <circle cx="44" cy="48" r="3.5" fill="#c084fc" />
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
</svg>
